name: background_location_tracker_example
description: trackerGPS.
publish_to: 'none'

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  background_location_tracker: ^1.6.1
  connectivity_plus: ^6.1.3
  flutter:
    sdk: flutter
  flutter_background_service: ^5.1.0
  flutter_launcher_icons: ^0.14.3
  flutter_local_notifications: ^18.0.1
  http: ^1.3.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.3
  workmanager: ^0.6.0
