  <style>
    :root {
      --bg: #f4f1ea;
      --panel: rgba(255, 252, 246, 0.88);
      --text: #2d241d;
      --muted: #6f6358;
      --border: rgba(76, 58, 43, 0.14);
      --shadow: 0 24px 60px rgba(59, 42, 25, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 198, 120, 0.18), transparent 28%),
        linear-gradient(180deg, #f8f5ef 0%, #ebe5d8 100%);
      color: var(--text);
    }

    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      padding: 18px;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sidebar {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .stat {
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.45);
    }

    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid var(--border);
    }

    .legend-bar {
      flex: 1;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #2d6cdf 0%, #30c7ff 20%, #54df85 45%, #ffe04b 70%, #ff8f2b 85%, #b62222 100%);
    }

    .map-wrap {
      position: relative;
      min-height: calc(100vh - 36px);
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .leaflet-container {
      background: #e7dfd0;
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .map-wrap {
        min-height: 70vh;
      }
    }
  </style>

    document.getElementById('pointsCount').textContent = points.length.toLocaleString('ru-RU');
    document.getElementById('startTime').textContent = points[0].time || 'Нет данных';
    document.getElementById('endTime').textContent = points[points.length - 1].time || 'Нет данных';

    const map = L.map('map', {
      zoomControl: true,
      preferCanvas: true,
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);

    const latLngs = points.map((point) => [point.lat, point.lon]);
    map.fitBounds(latLngs, { padding: [40, 40] });

    for (let i = 0; i < points.length - 1; i += 1) {
      const start = points[i];
      const end = points[i + 1];
      const progress = i / Math.max(points.length - 2, 1);

      L.polyline(
        [
          [start.lat, start.lon],
          [end.lat, end.lon],
        ],
        {
          color: gradientColor(progress),
          weight: 4,
          opacity: 0.95,
          lineCap: 'round',
          lineJoin: 'round',
        }
      ).addTo(map);
    }

    L.circleMarker(latLngs[0], {
      radius: 7,
      color: '#173b8c',
      weight: 3,
      fillColor: '#61b8ff',
      fillOpacity: 1,
    }).addTo(map).bindPopup('<b>Старт</b><br>' + escapeHtml(points[0].time || ''));

    L.circleMarker(latLngs[latLngs.length - 1], {
      radius: 7,
      color: '#7b130d',
      weight: 3,
      fillColor: '#ff9350',
      fillOpacity: 1,
    }).addTo(map).bindPopup('<b>Финиш</b><br>' + escapeHtml(points[points.length - 1].time || ''));

    const sampledPoints = points.filter((_, index) => index % 80 === 0);
    sampledPoints.forEach((point, index) => {
      const progress = index / Math.max(sampledPoints.length - 1, 1);
      L.circleMarker([point.lat, point.lon], {
        radius: 2.5,
        stroke: false,
        fillColor: gradientColor(progress),
        fillOpacity: 0.85,
      }).addTo(map);
    });

    function gradientColor(progress) {
      const hue = 220 - (progress * 220);
      return 'hsl(' + hue + ', 82%, 50%)';
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
